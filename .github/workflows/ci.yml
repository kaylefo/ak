name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          pip install ruff==0.8.4

      - name: Ruff check
        run: |
          ruff check services/ packages/contracts/python tests/

      - name: Ruff format check
        run: |
          ruff format --check services/ packages/contracts/python tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r services/api/requirements.txt
          pip install -r services/ingest/requirements.txt
          pip install -r services/worker/requirements.txt
          pip install -r tests/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: services/api:services/ingest:services/worker:packages/contracts/python
        run: |
          pytest tests/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: |
          docker build -f infra/docker/api/Dockerfile -t tsubo-api:ci .

      - name: Build worker image
        run: |
          docker build -f infra/docker/worker/Dockerfile -t tsubo-worker:ci .
