name: Terpeezy Leafly Exact Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/leafly_acceptance.py'
      - '.github/workflows/terpeezy-leafly-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Scrapling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'scrapling[fetchers]==0.4.11' lxml orjson

      - name: Fetch actual Leafly page 1 and full fixture records
        run: python .github/scripts/leafly_acceptance.py

      - name: Verify explicit full-record fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('acceptance-out/summary.json').read_text())
          print(json.dumps(summary, indent=2))
          assert summary['listing_status'] == 200
          assert summary['listing_cards_found'] >= 18
          for slug in ('blue-dream', 'lemon-cherry-gelato', 'white-widow'):
              record = json.loads(Path(f'acceptance-out/{slug}.json').read_text())
              assert record['identity']['name']
              assert record['profile']['description_text']
              assert isinstance(record['profile']['effects'], dict)
              assert isinstance(record['profile']['flavors'], dict)
              assert isinstance(record['profile']['terpenes'], dict)
              assert isinstance(record['profile']['reported_symptoms'], dict)
              assert isinstance(record['genetics']['parents'], list)
              assert isinstance(record['genetics']['children'], list)
              assert isinstance(record['cultivation'], dict)
              assert isinstance(record['reviews'], list)
              assert 'raw_page_props' in record
          PY

      - name: Package acceptance corpus
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive('terpeezy-leafly-exact-acceptance', 'zip', 'acceptance-out')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: terpeezy-leafly-exact-acceptance
          path: terpeezy-leafly-exact-acceptance.zip
          compression-level: 0
          retention-days: 7
