services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tsubo
      POSTGRES_PASSWORD: tsubo
      POSTGRES_DB: tsubo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsubo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/tsubo-raw;
      exit 0;
      "

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: tsubo
      POSTGRES_PWD: tsubo
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tsubo:tsubo@postgres:5432/tsubo
      DATABASE_URL_SYNC: postgresql://tsubo:tsubo@postgres:5432/tsubo
      REDIS_URL: redis://redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT: http://minio:9000
      TEMPORAL_ADDRESS: temporal:7233
      SMTP_HOST: mailpit
      APP_BASE_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app/services/api
      - ./packages/contracts/python:/app/packages/contracts/python
      - ./sources:/app/sources

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tsubo:tsubo@postgres:5432/tsubo
      DATABASE_URL_SYNC: postgresql://tsubo:tsubo@postgres:5432/tsubo
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./services/ingest:/app/services/ingest
      - ./services/worker:/app/services/worker
      - ./packages/contracts/python:/app/packages/contracts/python
      - ./sources:/app/sources

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/ui:/app/packages/ui
      - ./packages/contracts/typescript:/app/packages/contracts/typescript

volumes:
  postgres_data:
  opensearch_data:
  minio_data:
